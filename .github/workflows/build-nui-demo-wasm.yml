name: Build nui-demo (wasm) and deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build nuigi-demo (wasm) on Windows
    runs-on: windows-2022
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4.1.7

      - name: Install Nim (nightly)
        uses: iffy/install-nim@v5
        with:
          version: nightly:https://github.com/nim-lang/nightlies/releases/tag/2025-10-31-version-2-2-ab00c56904e3126ad826bb520d243513a139436a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Nimony
        run: |
          git clone https://github.com/nim-lang/nimony
          git -C nimony checkout a843b98c91d1c57eb5e1f9e21b23435a3ad898ee

      - name: Cache Nimony build
        id: nimony-cache
        uses: actions/cache@v4
        with:
          path: |
            nimony/bin
            nimony/nimcache2
            nimony/hastur.exe
          key: ${{ runner.os }}-nimony-a843b98c91d1c57eb5e1f9e21b23435a3ad898ee

      - name: Build Nimony
        if: ${{ steps.nimony-cache.outputs.cache-hit != 'true' }}
        working-directory: nimony
        run: |
          nim c -o:hastur.exe .\src\hastur.nim
          .\hastur.exe --release build all

      - name: Add Nimony to PATH
        run: Add-Content $env:GITHUB_PATH "${{ github.workspace }}\nimony\bin"

      - name: Cache nimble modules / emsdk / nimcache
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            deps
            nimcache
            emsdk
            build
            bin
            vendor/harfbuzz/src
          key: ${{ runner.os }}-nuigi-demo-wasm-${{ hashFiles('atlas.lock') }}-3

      - name: Download emscripten
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: git clone https://github.com/emscripten-core/emsdk.git

      - name: Install emscripten
        run: |
          ./emsdk/emsdk.ps1 install 4.0.10
          ./emsdk/emsdk.ps1 activate 4.0.10

      - name: Install Ninja (used by the SDL3 wasm build)
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile ninja-win.zip
          New-Item -ItemType Directory -Force -Path "ninja-win" | Out-Null
          Expand-Archive -Force -Path ninja-win.zip -DestinationPath "ninja-win"

      # - name: Install project dependencies (atlas)
      #   run: |
      #     atlas rep
      #     atlas install

      - name: install meson
        run: python -m pip install meson ninja

      # 1) Build the build.nim tool itself (produces build.exe)
      - name: Compile build.nim
        run: nim c -o:build.exe build.nim

      - name: Build deps (sdl3, freetype, harfbuzz, fribidi)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: ./build.exe deps

      - name: Build test nim2
        run: ./build.exe test --nim2

      - name: Build test nimony
        run: ./build.exe test --nimony

      - name: Build demo native with Nim 2
        run: ./build.exe demo --nim2

      - name: Build demo native with Nimony
        run: ./build.exe demo --nimony

      - name: Run Nim 2 demo
        run: ./bin/demo.exe --test

      - name: Stage native demos
        run: |
          New-Item -ItemType Directory -Force -Path native-demo | Out-Null
          Copy-Item bin/demo.exe native-demo/
          Copy-Item bin/demo-nimony.exe native-demo/
          Copy-Item bin/*.dll native-demo/
          Copy-Item *.dxil native-demo/
          Copy-Item assets native-demo/assets -Recurse

      - name: Upload native demos
        uses: actions/upload-artifact@v4
        with:
          name: nuigi-demo-windows
          path: native-demo
          if-no-files-found: error

      # 2) Build the nuigi-demo as wasm (html + js + wasm) via the build tool.
      #    EMSDK is read by build.nim to activate the emscripten environment.
      - name: Build demo with wasm
        env:
          EMSDK: ${{ github.workspace }}/emsdk
        run: ./emsdk/emsdk.ps1 activate 4.0.10; ./build.exe demo --wasm

      # 3) Collect the wasm artifacts for GitHub Pages
      - name: Stage GitHub Pages artifact
        run: |
          New-Item -ItemType Directory -Force -Path pages | Out-Null
          Copy-Item build/nuigi-demo.html pages/
          Copy-Item build/nuigi-demo.js   pages/
          Copy-Item build/nuigi-demo.wasm pages/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
